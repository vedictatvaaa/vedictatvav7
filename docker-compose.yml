# One-click stack for self-hosted VPS (or Coolify "Docker Compose" service).
# Spins up: app + Postgres 16 + persistent volumes for uploads/backups/db.
#
# Quick start:
#   1. cp .env.example .env  &&  fill in real secrets
#   2. docker compose up -d --build
#   3. open http://<vps-ip>:5000  (front it with nginx/Coolify proxy for TLS)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vedictatva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vedictatva}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vedictatva} -d ${POSTGRES_DB:-vedictatva}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Expose only inside the docker network. Uncomment to expose for external admin tools.
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Wire app → postgres service
      PG_DATABASE_URL: postgres://${POSTGRES_USER:-vedictatva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vedictatva}
      DATABASE_URL: postgres://${POSTGRES_USER:-vedictatva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vedictatva}
      # All app secrets — see .env.example
      SESSION_SECRET: ${SESSION_SECRET}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET}
      ORDER_LOOKUP_SECRET: ${ORDER_LOOKUP_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SHIPROCKET_WEBHOOK_TOKEN: ${SHIPROCKET_WEBHOOK_TOKEN}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      GSC_SITE_URL: ${GSC_SITE_URL:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      DEPLOY_FROM_BROWSER: ${DEPLOY_FROM_BROWSER:-0}
      SKIP_DB_PUSH: ${SKIP_DB_PUSH:-0}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    ports:
      - "${APP_PORT:-5000}:5000"

volumes:
  pgdata:
  uploads:
  backups:
